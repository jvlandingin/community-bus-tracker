<!doctype html>
<!--
  The stage for the showcase video: one 1080x1920 frame, drawn once per
  frame by tools/video/render.js. Not a page anyone visits.

  The phone's screen is a screenshot of the real index.html, taken a moment
  before by the same script, and everything else here is the frame around
  it: the caption, the camera, the tap rings and the ring that closes in on
  a button just before each, the buzz, and the drawn interludes, which are
  index.html's own pictures (its SIGNBOARD and PICTURES blocks, run by
  render.js the way tools/make-pictures.js runs them).

  index.html's own stylesheet is put in where the marker below is, so the
  pictures carry their real colours and animations and the type is the
  app's. The rules after it are this page's, and are all under #v.

  Nothing here keeps time of its own. render.js calls V.render(t) with the
  video's time in seconds (and, in a film of the app, the phone's clock for
  its status bar), and every position below is worked out from t, so a
  frame is the same however long it took to draw.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bus Tracker video stage</title>
<!--APP-STYLES-->
<style>
  html, body{margin:0; padding:0; width:1080px; height:1920px; overflow:hidden; background:#e4876a;}
  body{max-width:none; min-height:0;}
  /* The frame is the app icon's morning coral, as Play's feature graphic
     and the link preview have it (tools/app-icons.html), and its words are
     the deep maroon the coral needs: white on it is too faint. */
  #v{position:relative; width:1080px; height:1920px; overflow:hidden; font-family:var(--font-ui);
     background:linear-gradient(180deg, #e4876a 0%, #eda27a 55%, #f2b88a 100%); color:#4a1119;}
  #v *{box-sizing:border-box;}

  /* The phone. Its screen is 860 pixels across for the page's 390, so one
     CSS pixel of the page is 860/390 here. render.js maps the page's
     rectangles through the same numbers (SCREEN in render.js). */
  #v-world{position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; will-change:transform;}
  #v-phone{position:absolute; left:92px; top:347px; width:896px; height:1547px; border-radius:72px;
           background:linear-gradient(160deg, #2a201c, #120c0a 60%); padding:18px;
           box-shadow:0 40px 90px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.07) inset, 0 0 0 1px #000;}
  #v-glass{position:relative; width:860px; height:1511px; border-radius:56px; overflow:hidden; background:#7a1f2b;}
  /* The browser's bar, tinted by the page's theme-color (#7a1f2b) as
     Chrome on Android tints it: this is a web page, not an app. */
  #v-bar{height:56px; display:flex; align-items:center; justify-content:center; gap:10px;
         background:#7a1f2b; color:#f6e7d8; font:500 27px/1 var(--font-ui); letter-spacing:.2px;}
  #v-bar svg{width:20px; height:20px; fill:none; stroke:#f6e7d8; stroke-width:2.4; stroke-linecap:round;}
  /* On a phone filmed as the app, the sharer's, Android's status bar
     instead: the phone's clock, and signal, wifi and battery, on the app's
     colorPrimaryDark. */
  #v-status{height:56px; display:none; align-items:center; justify-content:space-between; padding:0 36px 0 44px;
            background:#5c161f; color:#fff; font:600 28px/1 var(--font-ui);}
  #v-status .icons{display:flex; gap:12px; align-items:center;}
  #v-status .icons svg{width:24px; height:24px; fill:#fff; stroke:none;}
  #v-glass.app #v-bar{display:none;}
  #v-glass.app #v-status{display:flex;}
  #v-screen{display:block; width:860px; height:1455px; background:#f4eee3;}

  /* The caption: one short sentence, big, at the top, over a band of the
     background so the phone can be zoomed under it without the words
     losing their ground. The band comes and goes with the caption. */

          background:linear-gradient(#e4876a 0%, #e78f6f 81%, rgba(231,143,111,0) 100%); opacity:0;}
  #v-cap{position:absolute; left:50px; right:50px; top:64px; height:240px; display:flex; align-items:center; justify-content:center;}

<body>
<div id="v">
  <div id="v-world">
    <div id="v-phone"><div id="v-glass">
      <div id="v-bar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>community-bus-tracker.netlify.app</div>
      <div id="v-status"><span class="clock"></span><span class="icons"><svg viewBox="0 0 24 24"><path d="M3 21h18V3z"/></svg><svg viewBox="0 0 24 24"><path d="M12 21 1.5 8.5a15.5 15.5 0 0 1 21 0z"/></svg><svg viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="18" rx="2"/><rect x="10" y="1.5" width="4" height="3" rx="1"/></svg></span></div>
      <img id="v-screen" alt="">
    </div></div>
  </div>
  <div id="v-band"></div>
  <div id="v-cap"></div>
  <div id="v-fx"></div>
  <div id="v-ints"></div>
</div>
<!--APP-PICTURES-->
<script>
'use strict';
// ---- Seeking the animations ------------------------------------------------
// Every animation on the stage, the pictures' included, is paused and put
// at the frame's time: born is when this script first saw it.
(function(){
  const born = new WeakMap();
  window.__vseek = function(ms){
    document.getAnimations().forEach(function(a){
      if (!born.has(a)) born.set(a, ms);
      a.pause();
      a.currentTime = Math.max(0, ms - born.get(a));
    });
  };
})();

const V = (function(){
  // Where the screen sits on the stage, and how many stage pixels make one
  // of the page's: kept the same as VIEW in render.js. The glass is 860 by
  // 1511 from (SX, TOP), the bar BAR high across its top, above the screen.
  const SX = 110, SY = 421, K = 860 / 390, BAR = 56, TOP = SY - BAR;
  // The least a close-up can be for the glass to be as wide as the frame,
  // and as tall.
  const WIDE = 1080 / 860, TALL = 1920 / 1511;
  // The caption's band, as #v-band draws it: BAND high, solid down to SOLID
  // and fading out below.
  const BAND = 420, SOLID = .81 * BAND;
  const clamp = function(x, a, b){ return x < a ? a : x > b ? b : x; };
  const ease = function(p){ p = clamp(p, 0, 1); return p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; };
  const easeOut = function(p){ p = clamp(p, 0, 1); return 1 - Math.pow(1 - p, 3); };
  const $ = function(id){ return document.getElementById(id); };

  let plan = { captions:[], phone:[], ints:[] };
  const cams = [], taps = [], points = [], buzzes = [], marks = [], gaps = [];

  function init(p){
    plan = p;
    const cap = $('v-cap');
    cap.innerHTML = plan.captions.map(function(c, i){
      return '<div class="c" data-i="' + i + '">' + c.html + '</div>';
    }).join('');
    $('v-ints').innerHTML = plan.ints.map(function(x){ return '<div class="v-int" id="i-' + x.id + '">' + x.html + '</div>'; }).join('');
  }
  // Something that happened in the page: a tap, a buzz, or a camera move
  // asked for by the script, each with the time it starts.
  function event(e){
    if (e.type === 'camera') cams.push(e);
    else if (e.type === 'tap') taps.push(e);
    else if (e.type === 'point') points.push(e);
    else if (e.type === 'mark') marks.push(e);
    else if (e.type === 'buzz') buzzes.push(e);
  }
  function screen(url){
    const im = $('v-screen');
    return new Promise(function(res){
      im.onload = function(){ res(true); };
      im.onerror = function(){ res(false); };
      im.src = url;
    });
  }

  // The camera: a scale and a shift of the whole phone, from where the last
  // move ended to where the next one goes. A move names a rectangle of the
  // page (in the page's pixels) to fill a width of the stage, or null to go
  // back to the whole phone. moving while it goes; close once it is there,
  // if it went to a close-up.
  function camAt(t){
    let from = { z:1, x:0, y:0 }, cur = from;
    cams.forEach(function(c){
      if (c.at > t) return;
      const dur = c.dur || .6;
      const to = c.rect ? frameFor(c.rect, c.width || 1000, c.cy || 1080, c.topAt, c.maxZ, captioned(c.at + dur)) : { z:1, x:0, y:0 };
      const p = ease((t - c.at) / dur);
      cur = { z: from.z + (to.z - from.z) * p, x: from.x + (to.x - from.x) * p, y: from.y + (to.y - from.y) * p,
              moving: p < 1, close: p >= 1 && !!c.rect };
      from = p >= 1 ? to : cur;
    });
    return cur;
  }
  function captioned(t){ return plan.captions.some(function(c){ return t >= c.from && t < c.to; }); }
  // A close-up fills the frame with the glass, but for the top of the frame
  // where a caption's band is over it once the camera is there (capped): as
  // near as that needs, moved only as far as the glass goes, and the bar
  // across the top of the glass whole or out of sight (under a caption,
  // under the band's solid part). Framed only by where the element was, a
  // close-up could leave the top of the frame to a band that was not there,
  // or bring the foot of the phone into sight, and the backdrop showed.
  function frameFor(r, width, cy, topAt, maxZ, capped){
    const w = r.w * K, cx = SX + (r.x + r.w / 2) * K, y = SY + (r.y + r.h / 2) * K;
    const z = Math.max(clamp(width / w, 1, maxZ || 1.75), WIDE, capped ? 1 : TALL);
    if (topAt) cy = topAt + r.h * K * z / 2;
    const f = { z:z, x: clamp(540 - cx * z, 1080 - (SX + 860) * z, -SX * z), y: cy - y * z };
    if (capped) f.y = clamp(f.y, 1920 - (TOP + 1511) * z, SOLID - SY * z);
    else {
      f.y = clamp(f.y, 1920 - (TOP + 1511) * z, -TOP * z);
      if (f.y > -SY * z) f.y = -TOP * z;
    }
    return f;
  }
  // A page point on the stage, through the camera.
  function toStage(x, y, cam){
    return { x: (SX + x * K) * cam.z + cam.x, y: (SY + y * K) * cam.z + cam.y };
  }

  // The phone's way in and out: keyframes of a vertical offset in stage
  // pixels, eased between.
  function track(keys, t, dflt){
    if (!keys || !keys.length) return dflt;
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++){
      if (t <= keys[i][0]){
        const a = keys[i-1], b = keys[i];
        return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0]));
      }
    }
    return keys[keys.length - 1][1];
  }

  // clock: what the phone's status bar says now, for a phone filmed as the
  // app; none for one filmed as a browser, which has the browser's bar.
  function render(t, clock){
    $('v-glass').classList.toggle('app', !!clock);
    if (clock) $('v-status').querySelector('.clock').textContent = clock;
    // The phone: in, out, and the camera on it.
    const cam = camAt(t);
    const dy = track(plan.phone, t, 0), dx = track(plan.phoneX, t, 0);
    let shake = '';
    buzzes.forEach(function(b){
      const total = b.ms / 1000;
      const u = t - b.at;
      if (u < 0 || u > total) return;
      // Strong in the pattern's "on" parts, still in its gaps.
      let on = false, acc = 0;
      for (let i = 0; i < b.pattern.length; i++){ const s = b.pattern[i] / 1000; if (u >= acc && u < acc + s){ on = i % 2 === 0; break; } acc += s; }
      if (on){
        const a = b.strong ? 1 : .45;
        const w = Math.sin(u * 2 * Math.PI * 24);
        shake = ' translate(' + (w * 9 * a).toFixed(1) + 'px,' + (Math.cos(u * 2 * Math.PI * 19) * 3 * a).toFixed(1) + 'px) rotate(' + (w * 1.1 * a).toFixed(2) + 'deg)';
        // In a close-up the phone also grows as it shakes, just enough that
        // its edges stay out of the frame.
        if (cam.close) shake += ' scale(' + (1 + .055 * a).toFixed(3) + ')';
      }
    });
    $('v-world').style.transform = 'translate(' + (cam.x + dx).toFixed(2) + 'px,' + (cam.y + dy).toFixed(2) + 'px) scale(' + cam.z.toFixed(4) + ')';
    $('v-phone').style.transform = shake ? shake.trim() : '';

    // The caption: in from below, out by fading.
    const cap = $('v-cap');
    cap.classList.toggle('on-sky', !!plan.captions.some(function(c){ return c.sky && t >= c.from && t < c.to; }));
    let shown = 0;
    [].forEach.call(cap.children, function(el){
      const c = plan.captions[+el.getAttribute('data-i')];
      const pin = easeOut((t - c.from) / .32), pout = clamp((c.to - t) / .22, 0, 1);
      const o = t < c.from || t >= c.to ? 0 : Math.min(pin, pout);
      shown = Math.max(shown, o);
      el.style.opacity = o.toFixed(3);
      el.style.transform = 'translateY(' + ((1 - pin) * 34).toFixed(1) + 'px)';
    });
    // The band behind the caption, as soon as the phone comes up under it,
    // and only while there is a caption: without one the close-up fills the
    // frame.
    const band = clamp((cam.z - 1) * 8, 0, 1) * shown;
    $('v-band').style.opacity = band.toFixed(3);
    // A close-up that has settled shows nothing round the glass but the
    // band: noted when it does, and which edge, for the render to say.
    if (cam.close && !dx && !dy && !shake){
      const edges = [SX * cam.z + cam.x > .5 && 'left', (SX + 860) * cam.z + cam.x < 1079.5 && 'right',
                     TOP * cam.z + cam.y > (band > .01 ? BAND : 0) + .5 && 'top', (TOP + 1511) * cam.z + cam.y < 1919.5 && 'foot'];
      if (edges.some(Boolean)) gaps.push({ t:t, edges:edges.filter(Boolean) });
    }

    // Taps: a ring that grows a little and goes. Before each, an empty ring
    // closes in on the place, and hands over to it as the tap lands.
    const fx = $('v-fx');
    let html = '';
    points.forEach(function(e){
      const u = (t - e.at) / e.dur;
      if (u < 0 || u > 1.25) return;
      const p = toStage(e.x, e.y, cam), k = easeOut(Math.min(u, 1));
      const s = 1.7 - 1.15 * k, o = u <= 1 ? k : 1 - (u - 1) / .25;
      html += '<div class="v-point" style="left:' + (p.x + dx).toFixed(1) + 'px;top:' + (p.y + dy).toFixed(1) + 'px;transform:scale(' + s.toFixed(3) + ');opacity:' + o.toFixed(3) + '"></div>';
    });
    taps.forEach(function(e){
      const u = (t - e.at) / .5;
      if (u < 0 || u > 1) return;
      const p = toStage(e.x, e.y, camAt(e.at));
      const s = .55 + .55 * easeOut(u), o = u < .15 ? u / .15 : 1 - easeOut((u - .15) / .85);
      html += '<div class="v-tap" style="left:' + (p.x + dx).toFixed(1) + 'px;top:' + (p.y + dy).toFixed(1) + 'px;transform:scale(' + s.toFixed(3) + ');opacity:' + o.toFixed(3) + '"></div>';
    });
    // A place pointed out: three rings out from it, a third of a second
    // apart, for as long as it lasts. They follow the camera, so they stay
    // on the place while it zooms in.
    marks.forEach(function(e){
      const u = t - e.at;
      if (u < 0 || u > e.dur) return;
      const p = toStage(e.x, e.y, cam);
      for (let i = 0; i < 3; i++){
        const k = ((u + i * .33) % 1);
        const fade = Math.min(1, (e.dur - u) / .3);
        html += '<div class="v-mark" style="left:' + (p.x + dx).toFixed(1) + 'px;top:' + (p.y + dy).toFixed(1) + 'px;transform:scale(' +
          (.25 + 1.05 * easeOut(k)).toFixed(3) + ');opacity:' + (Math.min(1, (1 - k) * 1.6) * fade).toFixed(3) + '"></div>';
      }
      if (e.label){
        const pin = easeOut(u / .3), o = Math.min(pin, Math.min(1, (e.dur - u) / .3));
        html += '<div class="v-mark-name" style="left:' + (p.x + dx + 110 - (1 - pin) * 30).toFixed(1) + 'px;top:' + (p.y + dy).toFixed(1) +
          'px;opacity:' + o.toFixed(3) + '">' + String(e.label).replace(/[&<>]/g, '') + '</div>';
      }
    });
    // The buzz: arcs either side of the phone while it shakes.
    buzzes.forEach(function(b){
      const u = t - b.at;
      if (u < 0 || u > b.ms / 1000 + .25 || !b.strong) return;
      const o = clamp(1 - u / (b.ms / 1000 + .25), 0, 1);
      for (let i = 0; i < 2; i++){
        const k = ((u * 3 + i * .5) % 1);
        const off = 20 + k * 40;
        const y = 1110 - 75;
        html += '<div class="v-wave" style="left:' + (988 + off).toFixed(0) + 'px;top:' + y + 'px;opacity:' + (o * (1 - k)).toFixed(3) + '"></div>' +
                '<div class="v-wave l" style="left:' + (52 - off).toFixed(0) + 'px;top:' + y + 'px;opacity:' + (o * (1 - k)).toFixed(3) + '"></div>';
      }
    });
    fx.innerHTML = html;

    // The interludes, each a page of its own: up from below as the phone
    // goes up and out of the top, and away up the same way.
    plan.ints.forEach(function(x){
      const el = $('i-' + x.id);
      const a = x.in ? x.in[0] : -1, d = x.out ? x.out[1] : 1e9;
      const on = t >= a && t < d;
      let y = 0;
      if (x.in && t < x.in[1]) y = 1920 * (1 - ease((t - x.in[0]) / (x.in[1] - x.in[0])));
      if (x.out && t >= x.out[0]) y = -1920 * ease((t - x.out[0]) / (x.out[1] - x.out[0]));
      el.style.opacity = on ? '1' : '0';
      el.style.visibility = on ? 'visible' : 'hidden';
      el.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
      if (on && INT[x.id]) INT[x.id](el, t - (x.in ? x.in[1] : 0), x);
    });
    window.__vseek(t * 1000);
  }

  // Each interlude's own movement, as a function of its local time u.
  const sweep = function(el, p){
    el.querySelectorAll('.lit').forEach(function(l){
      l.style.clipPath = 'inset(0 ' + ((1 - clamp(p, 0, 1)) * 100).toFixed(2) + '% 0 0)';
    });
  };
  // ---- The animated film's movements (motion.js) ----
  const back = function(p){ p = clamp(p, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  // Keyframes [[u, value], ...], eased between, as motion.js reckons them.
  const keyed = function(k, u){
    if (u <= k[0][0]) return k[0][1];
    for (let i = 1; i < k.length; i++) if (u <= k[i][0]){ const a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * ease((u - a[0]) / (b[0] - a[0])); }
    return k[k.length - 1][1];
  };
  // A picture drawn again only when it has changed.
  const draw = function(el, html){ if (el.__h !== html){ el.__h = html; el.innerHTML = html; } };
  // Kinetic type: each word in on its own, a beat apart, up from below with
  // a little overshoot.
  const kinetic = function(kt, u, at){
    [].forEach.call(kt.querySelectorAll('.w'), function(w, i){
      const p = (u - at - i * .09) / .5, b = back(p);
      w.style.transform = 'translateY(' + ((1 - b) * 90).toFixed(1) + 'px) scale(' + (.75 + .25 * b).toFixed(3) + ')';
      w.style.opacity = clamp(p * 3, 0, 1).toFixed(3);
    });
  };
  // A thing popping in at `at`, to a little over its size and back.
  const popIn = function(el, u, at){
    const p = (u - at) / .45;
    el.style.transform = 'scale(' + Math.max(0, back(p)).toFixed(3) + ')';
    el.style.opacity = clamp(p * 4, 0, 1).toFixed(3);
  };
  // A card coming up into its place.
  const rise = function(el, u, at){
    el.style.transform = 'translateY(' + ((1 - easeOut((u - at) / .55)) * 160).toFixed(1) + 'px)';
    el.style.opacity = clamp((u - at) / .25, 0, 1).toFixed(3);
  };
  const INT = {
    title: function(el, u){
      sweep(el.querySelector('.v-board'), (u - .35) / .9);
      const hook = el.querySelector('.hook');
      const p = easeOut((u - 1.1) / .4);
      hook.style.opacity = p.toFixed(3);
      hook.style.transform = 'translateY(' + ((1 - p) * 40).toFixed(1) + 'px)';
      const sc = el.querySelector('.v-scene');
      sc.style.transform = 'translateY(' + (-(u * 10)).toFixed(1) + 'px)';
    },
    trip: function(el, u){
      sweep(el.querySelector('.v-board'), (u - .15) / .5);
    },
    end: function(el, u){
      sweep(el.querySelector('.v-board'), (u - .1) / .8);
      ['e-name', 'e-lede', 'e-watch', 'e-droid', 'e-fine'].forEach(function(k, j){
        const n = el.querySelector('.' + k);
        if (!n) return;
        const p = easeOut((u - .25 - j * .16) / .45);
        n.style.opacity = p.toFixed(3);
        n.style.marginTop = ((1 - p) * 30).toFixed(1) + 'px';
      });
    },
    // The animated film's scenes, each from its plan (x, motion.js).
    'm-hook': function(el, u, x){
      kinetic(el.querySelector('.kt'), u, x.kt);
      // The question's last word swings once it has landed.
      const ws = el.querySelectorAll('.kt .w'), q = ws[ws.length - 1], k = u - x.kt - (ws.length - 1) * .09 - .45;
      if (k > 0 && k < 2.5) q.style.transform += ' rotate(' + (Math.sin(k * 11) * 10 * Math.exp(-k * 2)).toFixed(2) + 'deg)';
      const road = el.querySelector('.m-road');
      draw(road, stopViewSvg({ aboard:false, f:keyed(x.f, u), sky:x.sky, worn:[], paint:'klasiko' }).replace('xMidYMax slice', 'xMinYMax slice'));
      road.style.transform = 'scale(' + (1 + .06 * ease(u / x.dur)).toFixed(4) + ')';
    },
    'm-route': function(el, u, x){
      sweep(el.querySelector('.v-board'), (u - .15) / .8);
      kinetic(el.querySelector('.kt'), u, x.kt);
      // The two lines drawn in, their stations, then the buses on them,
      // each its own way, with the ring the app's live buses breathe.
      el.querySelectorAll('.m-rail').forEach(function(r){ r.style.strokeDashoffset = (1000 * (1 - ease((u - x.railAt) / .9))).toFixed(1); });
      el.querySelectorAll('.m-stn').forEach(function(c, i){ c.style.opacity = clamp((u - x.railAt - .2 - i * .07) / .25, 0, 1).toFixed(3); });
      el.querySelectorAll('.m-bus').forEach(function(g, i){
        const b = x.buses[i], p = (u - b.at) / .45, along = clamp(b.x0 + b.v * Math.max(0, u - b.at), 0, 1);
        const px = b.dir > 0 ? x.rail[0] + along * (x.rail[1] - x.rail[0]) : x.rail[1] - along * (x.rail[1] - x.rail[0]);
        g.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + b.y + ') scale(' + Math.max(0, back(p)).toFixed(3) + ')');
        g.style.opacity = clamp(p * 4, 0, 1).toFixed(3);
        const live = g.querySelector('.m-live'), r = (Math.max(0, u - b.at) * .8 + i * .37) % 1;
        live.setAttribute('r', (50 + r * 56).toFixed(1));
        live.style.opacity = (u > b.at + .3 ? (1 - r) * .6 : 0).toFixed(3);
      });
    },
    'm-near': function(el, u, x){
      kinetic(el.querySelector('.kt'), u, x.kt);
      const card = el.querySelector('.m-card'), f = keyed(x.f, u), n = f <= 0 ? 0 : Math.ceil(f - 1e-6) - 1;
      rise(card, u, x.cardAt);
      draw(card, stopViewSvg({ aboard:false, f:f, sky:'day', worn:x.worn, paint:x.paint, here:n === 0 }));
      // Two stops off, the phone buzzes: the card shakes the way the phone would.
      const b = u - x.nearAt;
      if (b >= 0 && b < .5){ const w = Math.sin(b * 2 * Math.PI * 22); card.style.transform += ' translateX(' + (w * 12).toFixed(1) + 'px) rotate(' + (w * 1.1).toFixed(2) + 'deg)'; }
      const pill = el.querySelector('.m-pill'), here = u >= x.hereAt;
      pill.className = 'm-pill ' + (here ? 'here' : 'near');
      pill.textContent = here ? 'Sakay na!' : 'Malapit na!';
      popIn(pill, u, here ? x.hereAt : x.nearAt);
      const say = el.querySelector('.m-say');
      draw(say, n === 0 ? 'Next stop is yours.' : 'about<b>' + n + '</b>' + (n === 1 ? 'stop' : 'stops') + ' before yours');
      say.style.opacity = clamp((u - x.cardAt - .3) / .3, 0, 1).toFixed(3);
    },
    'm-share': function(el, u, x){
      kinetic(el.querySelector('.kt'), u, x.kt);
      rise(el.querySelector('.m-card'), u, x.cardAt);
      // The bus on everyone's map: a pin over it, and rings going out.
      const pin = el.querySelector('.m-pin');
      popIn(pin, u, x.pinAt);
      pin.style.transform += ' translateY(' + (Math.sin(Math.max(0, u - x.pinAt) * 3) * 8).toFixed(1) + 'px)';
      el.querySelectorAll('.m-ring').forEach(function(r, i){
        const k = u - x.pinAt - .2 - i * .45, p = k < 0 ? -1 : (k % 1.35) / 1.35;
        r.style.opacity = p < 0 ? '0' : ((1 - p) * .9).toFixed(3);
        r.style.transform = 'scale(' + (.6 + Math.max(0, p) * 2.6).toFixed(3) + ')';
      });
      // Salamat, from the riders: each up, and away.
      el.querySelectorAll('.m-ty').forEach(function(b, i){
        const at = x.tys[i], k = u - at;
        popIn(b, u, at);
        b.style.transform += ' translateY(' + (-Math.max(0, k) * 36).toFixed(1) + 'px)';
        if (k > 1.9) b.style.opacity = clamp(1 - (k - 1.9) / .4, 0, 1).toFixed(3);
      });
      const say = el.querySelector('.m-say');
      say.style.opacity = clamp((u - x.sayAt) / .35, 0, 1).toFixed(3);
      say.style.transform = 'translateY(' + ((1 - easeOut((u - x.sayAt) / .35)) * 30).toFixed(1) + 'px)';
    },
    'm-ticket': function(el, u, x){
      kinetic(el.querySelector('.kt'), u, x.kt);
      const card = el.querySelector('.m-card'), km = keyed(x.km, u);
      rise(card, u, x.cardAt);
      draw(card, stopViewSvg({ aboard:true, f:km, km:km, stops:x.stops, place:x.place, here:true, sky:'day', worn:x.worn, paint:x.paint }));
      popIn(el.querySelector('.m-pill'), u, x.flagAt);
      // Stop: the ticket comes up over the road, and its stamp comes down on it.
      const tk = el.querySelector('.m-tkt'), p = easeOut((u - x.tktAt) / .6);
      tk.style.transform = 'translateY(' + ((1 - p) * 1400).toFixed(1) + 'px) rotate(' + (-2.5 + (1 - p) * 6).toFixed(2) + 'deg)';
      const st = el.querySelector('.m-stamp'), q = (u - x.stampAt) / .22;
      st.style.opacity = q < 0 ? '0' : (.92 * clamp(q, 0, 1)).toFixed(3);
      st.style.transform = 'rotate(-14deg) scale(' + (q < 0 ? 2 : 2 - easeOut(q)).toFixed(3) + ')';
    },
    'm-dress': function(el, u, x){
      kinetic(el.querySelector('.kt'), u, x.kt);
      const card = el.querySelector('.m-card');
      rise(card, u, x.cardAt);
      let look = x.looks[0];
      x.looks.forEach(function(l){ if (u >= l.at) look = l; });
      draw(card, busSvg(look.keys, look.paint));
      const k = u - look.at;
      if (k >= 0 && k < .35) card.style.transform += ' scale(' + (1 + .05 * (1 - easeOut(k / .35))).toFixed(4) + ')';
      el.querySelectorAll('.m-tile').forEach(function(tl, i){ popIn(tl, u, x.tiles[i]); });
    }
  };

  return { init:init, event:event, screen:screen, render:render, gaps:function(){ return gaps; } };
})();
</script>
</body>
</html>
