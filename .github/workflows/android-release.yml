# Builds the SIGNED bundle for Google Play: run it from the Actions tab
# ("Android release bundle", Run workflow) when a new version of the app should
# go up. The counterpart to android.yml, which builds an unsigned debug APK on
# every change to mobile/ to prove it still compiles.
#
# Only on demand, because every upload to Play has to carry a higher version
# code than the last one Play saw. The run number is that code unless one is
# typed in, and the version name is 1.<code>, so a release in Play Console
# says which run made it.
#
# The key is an UPLOAD key. Google Play keeps the app's signing key (Play App
# Signing, which a new app starts on) and re-signs what it delivers, so the
# key here only proves an upload came from this project. Lose it and Play
# Console resets it in a day or two, with every installed app unaffected.
# Back it up anyway. mobile/README.md has the keytool command; a phone with
# Termux is enough to run it. Four repository secrets carry it:
#
#   BUS_KEYSTORE_BASE64     the .jks file, base64-encoded on one line
#   BUS_KEYSTORE_PASSWORD   its password
#   BUS_KEY_ALIAS           bus
#   BUS_KEY_PASSWORD        the SAME password: a keystore made by a current
#                           keytool is PKCS12, where the key has no password
#                           of its own, which is why keytool never asks for one
#
# Every check before the build below was a failed run somewhere first: a
# missing secret, a base64 blob cut short by selecting it by hand on a phone,
# an alias that was not in the file, two different passwords. Gradle only
# touches the key at the very end of the build, and then says only that it
# could not read it, so each is checked in seconds and named.
#
# The bundle is published to a release of its own, android-release-<code>, a
# prerelease so it never becomes the repository's latest release: one tap on a
# phone downloads it for the Play Console upload, where a run artifact is a zip
# behind a sign-in. A phone cannot install an .aab; the app is the Play listing.
name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: >-
          Play version code. Leave blank to use this workflow's run number,
          which always rises. Type one only to get past a number Play has
          already taken.
        required: false
        type: string

permissions:
  contents: write # the release the bundle is published to

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ inputs.versionCode || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.BUS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUS_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ]       || missing="$missing BUS_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing BUS_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing BUS_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing BUS_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "See mobile/README.md, \"Signing\", for how to make the key and set them."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Outside the working tree, so no later step can archive or commit it.
      # RUNNER_TEMP goes with the runner, and the last step deletes it anyway.
      - name: Decode the upload key
        env:
          KEYSTORE: ${{ secrets.BUS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/bus.jks"
          chmod 600 "$RUNNER_TEMP/bus.jks"

      # Nothing secret is printed on any path: the listing shows the aliases
      # the keystore holds, which is what fixing a wrong alias needs.
      - name: Check the key opens
        env:
          STORE_PASSWORD: ${{ secrets.BUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUS_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/bus.jks"
          LIST="$RUNNER_TEMP/keystore-list.txt"
          # The file first, then the password: both fail as "will not open",
          # and they are fixed in different places. A keystore starts with a
          # DER sequence, 30 82; an empty secret or a broken paste does not.
          SIZE=$(stat -c%s "$KS")
          MAGIC=$(head -c2 "$KS" | od -An -tx1 | tr -d ' \n')
          if [ "$SIZE" -lt 512 ] || [ "$MAGIC" != "3082" ]; then
            echo "BUS_KEYSTORE_BASE64 did not decode to a keystore."
            echo "  decoded size: $SIZE bytes (a real one is a few KB)"
            echo "  first bytes:  $MAGIC (expected 3082)"
            echo "Make it again with: base64 -w0 bus-tracker-upload.jks"
            echo "and set the whole output as the secret, one line, nothing added."
            exit 1
          fi
          # The keystore says how long it is: four header bytes plus the
          # length in bytes 3 and 4. So a paste that lost its end is a sum,
          # not a guess, where keytool would only say EOFException.
          WANT=$(( 4 + 0x$(dd if="$KS" bs=1 skip=2 count=2 2>/dev/null | od -An -tx1 | tr -d ' \n') ))
          if [ "$SIZE" -ne "$WANT" ]; then
            echo "BUS_KEYSTORE_BASE64 is INCOMPLETE: the paste was cut off."
            echo "  arrived:  $SIZE bytes"
            echo "  expected: $WANT bytes (the keystore's own header says so)"
            echo "It is one very long line, and selecting it by hand drops the end."
            echo "In Termux, put the whole of it on the clipboard instead:"
            echo "    base64 -w0 bus-tracker-upload.jks | termux-clipboard-set"
            echo "(termux-clipboard-set comes with: pkg install termux-api)"
            exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > "$LIST" 2>&1; then
            echo "The keystore is complete ($SIZE bytes) but will not open, so"
            echo "BUS_KEYSTORE_PASSWORD is not its password. keytool said:"
            grep -v "^Picked up " "$LIST" | sed 's/^/    /'
            exit 1
          fi
          if ! grep -qi "^${KEY_ALIAS}," "$LIST"; then
            echo "BUS_KEY_ALIAS is not an alias in this keystore. It holds:"
            grep -i "PrivateKeyEntry" "$LIST" | sed 's/^/    /'
            echo "Set BUS_KEY_ALIAS to one of those, exactly."
            exit 1
          fi
          if grep -qi "Keystore type: PKCS12" "$LIST" && [ "$STORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo "This keystore is PKCS12, where the key's password IS the store's."
            echo "BUS_KEY_PASSWORD differs from BUS_KEYSTORE_PASSWORD; set both to the same."
            exit 1
          fi
          echo "The key opens, and the alias and passwords agree."

      - name: Build the signed bundle
        working-directory: mobile
        env:
          BUS_KEYSTORE: ${{ runner.temp }}/bus.jks
          BUS_KEYSTORE_PASSWORD: ${{ secrets.BUS_KEYSTORE_PASSWORD }}
          BUS_KEY_ALIAS: ${{ secrets.BUS_KEY_ALIAS }}
          BUS_KEY_PASSWORD: ${{ secrets.BUS_KEY_PASSWORD }}
          BUS_VERSION_CODE: ${{ env.VERSION_CODE }}
          BUS_VERSION_NAME: 1.${{ env.VERSION_CODE }}
        run: |
          set -euo pipefail
          npm ci
          npx cap sync android
          cd android && ./gradlew --no-daemon bundleRelease

      # Proved, not assumed: an unsigned bundle builds happily and is only
      # refused at the upload. jarsigner -verify needs no password.
      - name: Check the bundle is signed
        run: |
          AAB=mobile/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q "jar verified" \
            || { echo "The bundle is NOT signed. Check the four secrets."; exit 1; }
          echo "Signed. Version code $VERSION_CODE, version name 1.$VERSION_CODE."

      # One release per version code, because Play never takes a number twice:
      # overwriting one with the next would leave no way to tell what the first
      # was. --clobber on the file lets a re-run at the same code replace it.
      - name: Publish the bundle to its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAB="bus-tracker-$VERSION_CODE.aab"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          TAG="android-release-$VERSION_CODE"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Android release bundle $VERSION_CODE" \
            --notes "Signed bundle for a Google Play upload: version code $VERSION_CODE, version name 1.$VERSION_CODE, built from $GITHUB_SHA. Not an install; a phone cannot open an .aab. The app is the Play listing."
          gh release upload "$TAG" "$AAB" --clobber
          echo "Published [$AAB](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) for the Play Console upload." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/bus.jks" "$RUNNER_TEMP/keystore-list.txt"
