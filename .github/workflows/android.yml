# Builds the Android app in mobile/ as a debug APK to prove a change to the
# shell still compiles, and attaches it to the run when run by hand.
#
# The app is a Capacitor shell around the live site, so a change to
# index.html reaches it on the next launch without a new build. Only a change
# to mobile/ itself (plugins, permissions, the shell) needs one, which is
# why this runs on that path and on demand rather than on every commit.
#
# The debug APK installs and runs, but it is signed with a key thrown away
# with the runner, so the next build will not install over it, and Play
# refuses it. The build that goes to Play is android-release.yml's: signed
# with the upload key from the repository's secrets, and run only on demand.
# A phone gets the app from Play, or from Play's internal testing while it is
# being tried (mobile/README.md, "Google Play").
name: android

on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx cap sync android
      - name: Build
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk ../out/bus-tracker-debug.apk
      # Kept only when the build is asked for by hand, and for a day. A push or a
      # pull request only has to prove the shell compiles, and saving a 4.8 MB
      # APK on each one for 14 days filled the account's 0.5 GB of Actions
      # storage in October 2026 (24 copies at once). Run it from the Actions tab
      # when you want the file.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bus-tracker-debug-apk
          path: mobile/out/*.apk
          if-no-files-found: error
          retention-days: 1
