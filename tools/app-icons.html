<!DOCTYPE html>
<!--
  The source for the home-screen icons and the link-preview picture.
  tools/render-icons.sh opens this page once per image, with the image's
  name as the #fragment, and screenshots it at that image's size. Nothing
  here is loaded by the site: the PNGs it produces are, from assets/icons/.

  The mark is the coach the map draws, front on, white on the livery's
  maroon with the gold trim along the foot and its signboard lit: the icon
  on a home screen and the badge on the map are one picture. The coach is
  the i-coach symbol copied from index.html, and tests/test-tokens.js fails
  if the copy below stops matching it. The favicon every page carries is
  the same mark, drawn at 32 points.

  The preview's route board is drawn by tools/make-pictures.js with the
  tracker's own renderer, and its words come from the .led span beside it,
  so a fork changes the words there and re-runs that, then render-icons.sh.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bus Tracker icons</title>
<style>
  /* The tracker's typeface, from the site's own files. render-icons.sh lets
     a file read its neighbours for exactly this. */
  @font-face{font-family:'Barlow Semi Condensed'; font-style:normal; font-weight:500; font-display:swap; src:url(../assets/fonts/barlow-semi-condensed-500.v1.woff2) format('woff2');}
  @font-face{font-family:'Barlow Semi Condensed'; font-style:normal; font-weight:600; font-display:swap; src:url(../assets/fonts/barlow-semi-condensed-600.v1.woff2) format('woff2');}
  @font-face{font-family:'Barlow Semi Condensed'; font-style:normal; font-weight:700; font-display:swap; src:url(../assets/fonts/barlow-semi-condensed-700.v1.woff2) format('woff2');}
  @font-face{font-family:'Barlow'; font-style:normal; font-weight:400; font-display:swap; src:url(../assets/fonts/barlow-400.v1.woff2) format('woff2');}
  @font-face{font-family:'Barlow'; font-style:normal; font-weight:600; font-display:swap; src:url(../assets/fonts/barlow-600.v1.woff2) format('woff2');}
  html, body{margin:0; height:100%; background:#000;}
  /* Sized from the width alone. Headless Chromium's screenshot viewport can
     come out shorter than the window it was asked for, so anything sized by
     vh leaves a black band at the bottom of the picture. */
  .art{display:none; width:100vw; height:100vw; position:relative; overflow:hidden;
       font-family:'Barlow Semi Condensed',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
  .art:target{display:block;}
  /* Painted across the picture when the viewport is shorter than the art,
     which is what full Chrome's headless mode does (see render-icons.sh).
     A warning in the image cannot be missed; a band along its foot can. */
  .short .art:target::before{content:'Viewport too short: render with chrome-headless-shell, see tools/render-icons.sh';
    position:absolute; inset:0; z-index:9; padding:6%; background:#ffe600; color:#000;
    font:800 7vw/1.15 sans-serif;}

  /* The mark: the coach on maroon, with the livery's gold trim along the
     bottom. Its windscreen and lamps are cut through, so they show the
     maroon, and its signboard is lit amber. Square and full-bleed: launchers
     and iOS cut their own corners. The maskable one keeps the coach inside
     the central safe zone, because Android may crop it to a circle. */
  .mark{background:linear-gradient(165deg,#8a2533 0%,#5c161f 100%);}
  .mark::after{content:''; position:absolute; left:0; right:0; bottom:0; height:9%; background:#e39a1c;}
  .mark svg{position:absolute; left:50%; top:46%; width:68%; height:68%; transform:translate(-50%,-50%); fill:#fff;}
  .mark .sign{fill:#ffb22e;}
  .mark.mask svg{width:50%; height:50%; top:47%;}
  .mark.mask::after{height:11%;}

  /* The picture a link preview shows in the group chat, 1200x630. */
  #preview{height:52.5vw; background:linear-gradient(180deg,#7a1f2b,#5c161f); color:#fff;}
  #preview::after{content:''; position:absolute; left:0; right:0; bottom:0; height:16px; background:#e39a1c;}
  .board.dm{position:absolute; left:70px; top:58px; padding:7px; border-radius:16px;
    background:radial-gradient(120% 140% at 30% 0%, #1d1513 0%, #0b0807 70%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.08), inset 0 6px 20px rgba(0,0,0,.75), 0 2px 0 rgba(255,255,255,.08);}
  .board.dm .led{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap;}
  .board .dmsvg{display:block;}
  .name{position:absolute; right:70px; top:62px; display:flex; align-items:center; gap:20px; text-align:right;}
  .name b{display:block; font-size:34px; font-weight:700; letter-spacing:.1em;}
  .name small{display:block; margin-top:4px; font-size:19px; font-weight:600; letter-spacing:.16em; color:#ffd27a;}
  .name .tile{position:relative; width:92px; height:92px; border-radius:22px; overflow:hidden;
    box-shadow:0 0 0 3px rgba(255,255,255,.18), 0 10px 24px -8px rgba(0,0,0,.6);}
  .name .tile svg{top:45%; width:70%; height:70%;}
  .head{position:absolute; left:74px; top:250px; font-size:84px; font-weight:700; letter-spacing:-.01em; line-height:1;}
  .sub{position:absolute; left:76px; top:354px; width:930px; font-family:'Barlow',sans-serif; font-size:29px; font-weight:400;
    line-height:1.38; color:rgba(255,255,255,.9);}
  .strip{position:absolute; left:78px; right:78px; bottom:64px; height:96px;}
  .strip > svg{width:100%; height:100%; overflow:visible;}
</style>
</head>
